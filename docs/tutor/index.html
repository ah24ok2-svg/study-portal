<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Study Portal 講師</title>
  <meta name="theme-color" content="#ff9f1a">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SP 講師">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="icon" type="image/png" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="tutor.css">
</head>
<body>
  <!-- ログイン -->
  <section id="login-view" class="login" hidden>
    <div class="login-card">
      <div class="login-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="32" height="32"><path d="M12 3l9 4.5-9 4.5-9-4.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M6.5 9.5V14c0 1.7 2.5 3 5.5 3s5.5-1.3 5.5-3V9.5M21 7.5V13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1>Study Portal <span class="role-badge">講師</span></h1>
      <p class="login-lead">講師のGoogleアカウントでログインしてください。</p>
      <p id="login-error" class="field-error" role="alert"></p>
      <button id="login-button" type="button" class="btn btn-primary btn-block">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M21 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5.1a4.4 4.4 0 0 1-1.9 2.9v2.4h3.1c1.8-1.7 2.7-4.1 2.7-7z" fill="currentColor"/><path d="M12 21.5c2.6 0 4.7-.9 6.3-2.3l-3.1-2.4c-.9.6-1.9.9-3.2.9-2.5 0-4.6-1.7-5.3-3.9H3.5v2.5a9.5 9.5 0 0 0 8.5 5.2z" fill="currentColor" opacity=".8"/><path d="M6.7 13.8a5.7 5.7 0 0 1 0-3.6V7.7H3.5a9.5 9.5 0 0 0 0 8.6z" fill="currentColor" opacity=".6"/><path d="M12 6.3c1.4 0 2.6.5 3.6 1.4l2.7-2.7A9.5 9.5 0 0 0 3.5 7.7l3.2 2.5C7.4 8 9.5 6.3 12 6.3z" fill="currentColor" opacity=".9"/></svg>
        Googleでログイン
      </button>
    </div>
  </section>

  <!-- メイン -->
  <div id="app-view" class="tutor-app" hidden>
    <header class="app-header">
      <div class="app-header-name">Study Portal <span class="role-badge">講師</span></div>
      <button id="logout-button" type="button" class="link-button">ログアウト</button>
    </header>

    <div id="layout" class="tutor-layout">
      <!-- 生徒一覧 -->
      <aside class="student-pane" aria-label="生徒一覧">
        <ul id="student-list" class="student-list"></ul>
        <p id="students-empty" class="empty" hidden>生徒がまだいません。<br>スプレッドシートのメニューから追加してください。</p>
        <p id="students-error" class="inline-error" role="alert" hidden></p>
      </aside>

      <!-- 生徒ごとの画面 -->
      <section id="detail-pane" class="detail-pane" aria-live="polite">
        <div id="detail-placeholder" class="detail-placeholder">
          <p>左の一覧から生徒を選んでください</p>
        </div>

        <div id="detail" class="detail" hidden>
          <div class="detail-head">
            <button id="back-button" type="button" class="icon-button back-button" aria-label="生徒一覧に戻る">
              <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <h2 id="detail-name" class="detail-name"></h2>
            <div class="segmented" role="tablist">
              <button id="seg-messages" type="button" role="tab" aria-selected="true" data-view="messages">やりとり</button>
              <button id="seg-submissions" type="button" role="tab" aria-selected="false" data-view="submissions">提出物 <span id="submission-count" class="count"></span></button>
            </div>
          </div>

          <div id="view-messages" class="detail-view messages-panel">
            <div id="message-list" class="message-list">
              <p id="messages-empty" class="empty" hidden>まだメッセージはありません。</p>
            </div>
            <p id="messages-error" class="inline-error" role="alert" hidden></p>
            <form id="composer" class="composer">
              <textarea id="composer-input" class="input composer-input" rows="1" maxlength="1000" placeholder="返信を入力" aria-label="返信"></textarea>
              <button id="composer-send" type="submit" class="btn btn-primary composer-send" disabled>送信</button>
            </form>
          </div>

          <div id="view-submissions" class="detail-view submissions-view" hidden>
            <p class="submissions-hint">「Driveで開く」からPDFビューアで書き込んで上書き保存すると、生徒のアプリにもそのまま表示されます。</p>
            <ul id="submission-list" class="submission-list"></ul>
            <p id="submissions-empty" class="empty" hidden>まだ提出はありません。</p>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../decor.js" defer></script>
  <script src="tutor.js" defer></script>
</body>
</html>
